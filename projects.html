<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width initial-scale=1">

  <title>Projects | Tyron Mullins</title>

  <link rel="stylesheet" href="/css/main.css">

  <style>
    body { background: #111; }

    .projects-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* GRID */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      grid-auto-rows: 200px;
      gap: 10px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
    }

    /* =========================
       PROJECT VIEWER
    ========================== */
    .project-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;

      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;

      transition: opacity 0.35s ease, transform 0.35s ease;

      z-index: 9998;
    }

    .project-viewer.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .viewer-scroll {
      display: flex;
      align-items: center;

      height: 100%;
      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* FULL WIDTH + EDGE BLUR */
    .viewer-scroll img {
      flex: 0 0 100vw;
      height: 100%;
      object-fit: contain;

      scroll-snap-align: center;
      cursor: zoom-in;

      /* edge blur */
      -webkit-mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 75%,
        rgba(0,0,0,0.6) 90%,
        rgba(0,0,0,0) 100%);
      mask-image: radial-gradient(circle,
        rgba(0,0,0,1) 75%,
        rgba(0,0,0,0.6) 90%,
        rgba(0,0,0,0) 100%);
    }

    /* CLOSE */
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      z-index: 10;
    }

    /* =========================
       FULLSCREEN VIEWER
    ========================== */
    .fullscreen-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;

      background: #000;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    .fullscreen-viewer.active {
      display: flex;
    }

    .fullscreen-viewer img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="panel-cover panel-cover--collapsed"
  style="background-image: url(/images/cover.jpg)">
  <div class="panel-main__inner panel-inverted">
    <div class="panel-main__content">
      <a href="/">
        <h1 class="panel-cover__title">MullT∞ | Tyron Mullins</h1>
      </a>

      <nav class="cover-navigation cover-navigation--primary">
        <ul class="navigation">
          <li class="navigation__item">
            <a href="/#blog">Blog</a>
          </li>
          <li class="navigation__item">
            <a href="/projects/">Projects</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>

<div class="projects-container">
  <div class="gallery" id="gallery"></div>
</div>

<!-- PROJECT VIEWER -->
<div class="project-viewer" id="project-viewer">
  <span class="close" id="viewer-close">&times;</span>
  <div class="viewer-scroll" id="viewer-scroll"></div>
</div>

<!-- FULLSCREEN -->
<div class="fullscreen-viewer" id="fullscreen-viewer">
  <img id="fullscreen-img">
</div>

<script src="/js/projects.js"></script>

</body>
</html>
